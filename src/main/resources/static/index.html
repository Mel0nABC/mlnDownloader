<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>MlnDownloader</title>

    <link rel="stylesheet" href="./assets/dist/css/bootstrap.min.css" />
    <script src="./assets/js/color-modes.js"></script>
    <script src="./assets/dist/js/bootstrap.bundle.min.js" class="astro-vvvwv3sm"></script>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="./js/mlnDownloaderWebSocket.js" type="module"></script>
    <script src="./js/mlnDownloaderFetch.js" type="module"></script>
    <script src="./js/mlnDownloaderEffects.js"></script>
    <link rel="stylesheet" href="./css/theme_selector.css" />
    <link rel="stylesheet" href="./css/alerts.css" />
</head>

<body class="d-none fade">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top shadow-sm">
        <div class="container py-2">

            <!-- botón móvil -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler"
                aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- contenido -->
            <div class="collapse navbar-collapse" id="navbarToggler">

                <div class="w-100 ">

                    <!-- título -->
                    <div class="row mb-3">
                        <div class="col">
                            <h4 class="fw-semibold mb-0">
                                mlnDownloader
                            </h4>

                            <small class="text-body-secondary">
                                Descarga archivos en múltiples fragmentos
                            </small>
                        </div>

                        <div id="infoDiscDiv" class="col border rounded p-2 h-100 text-center">
                            <h6 class="fw-semibold mb-0">
                                Información del disco
                            </h6>

                            <small class="text-body-secondary" data-file="disc-info">
                                XXX / XXX GB
                            </small>
                        </div>

                    </div>

                    <!-- formulario -->
                    <div class="row g-3 justify-content-center text-center">

                        <!-- URL -->
                        <div class="col-12 col-lg-12">
                            <label class="form-label small fw-semibold" for="urlInput">
                                URL
                            </label>

                            <input type="text" class="form-control form-control-sm text-center" id="urlInput" name="urlInput"
                                required placeholder="Introduce URL de descarga">
                        </div>

                    </div>

                    <div class="row g-3 justify-content-center text-center">

                        <!-- nombre archivo -->
                        <div class="col-12 col-lg-6">
                            <label class="form-label small fw-semibold" for="fileNameInput">
                                Nombre del archivo
                            </label>

                            <input type="text" class="form-control form-control-sm text-center" id="fileNameInput"
                                name="fileNameInput" required placeholder="archivo.iso">
                        </div>

                        <!-- chunks -->
                        <div class="col-12 col-lg-1">
                            <label class="form-label small fw-semibold" for="chucksInput">
                                Fragmentos
                            </label>

                            <input type="number" class="form-control form-control-sm  text-center" id="chucksInput"
                                name="chucksInput" required min="1" placeholder="introduce" value="10">
                        </div>

                        <!-- Limite velocidad -->
                        <div class="col-12 col-lg-3">
                            <label class="form-label small fw-semibold" for="speedLimit">
                                Límite velocidad (Mbytes/s)
                            </label>

                            <input type="number" class="form-control form-control-sm text-center" id="speedLimit"
                                name="speedLimit" required min="0.1" step="0.1" placeholder="100" value="100">
                        </div>

                        <!-- botón -->
                        <div class="col-12 col-lg-2 d-flex align-items-end">
                            <button class="btn btn-primary btn-sm w-100" id="btn" name="btn">
                                DOWNLOAD
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </nav>

    <article id="mainArticle" class="container mt-5">
        <div class="d-flex justify-content-end">
            <button class="btn btn-primary" id="cleanBtn">CLEAN DOWNLOADS</button>
        </div>


        <section class="container my-3">

            <div id="downloadsContainer"></div>

        </section>

    </article>

    <footer>
        <div class="container">
            <!-- <p>Footer 2025-2025</p> -->
            <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
                <symbol id="check2" viewBox="0 0 16 16">
                    <path
                        d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z">
                    </path>
                </symbol>
                <symbol id="circle-half" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"></path>
                </symbol>
                <symbol id="moon-stars-fill" viewBox="0 0 16 16">
                    <path
                        d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z">
                    </path>
                    <path
                        d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.156 1.156 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.156 1.156 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732L13.863.1z">
                    </path>
                </symbol>
                <symbol id="sun-fill" viewBox="0 0 16 16">
                    <path
                        d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z">
                    </path>
                </symbol>
            </svg>
            <div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle z-1">
                <button class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center" id="bd-theme"
                    type="button" aria-expanded="false" data-bs-toggle="dropdown" aria-label="Toggle theme (auto)">
                    <svg class="bi my-1 theme-icon-active" aria-hidden="true">
                        <use href="#circle-half"></use>
                    </svg>
                    <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
                    <li>
                        <button type="button" class="dropdown-item d-flex align-items-center"
                            data-bs-theme-value="light" aria-pressed="false">
                            <svg class="bi me-2 opacity-50" aria-hidden="true">
                                <use href="#sun-fill"></use>
                            </svg>
                            Tema claro
                            <svg class="bi ms-auto d-none" aria-hidden="true">
                                <use href="#check2"></use>
                            </svg>
                        </button>
                    </li>
                    <li>
                        <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark"
                            aria-pressed="false">
                            <svg class="bi me-2 opacity-50" aria-hidden="true">
                                <use href="#moon-stars-fill"></use>
                            </svg>
                            Tema Oscuro
                            <svg class="bi ms-auto d-none" aria-hidden="true">
                                <use href="#check2"></use>
                            </svg>
                        </button>
                    </li>
                    <li>
                        <button type="button" class="dropdown-item d-flex align-items-center active"
                            data-bs-theme-value="auto" aria-pressed="true">
                            <svg class="bi me-2 opacity-50" aria-hidden="true">
                                <use href="#circle-half"></use>
                            </svg>
                            Auto
                            <svg class="bi ms-auto d-none" aria-hidden="true">
                                <use href="#check2"></use>
                            </svg>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </footer>



</body>

</html>
